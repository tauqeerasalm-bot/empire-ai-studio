<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Greeting Instant AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            background: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Header */
        header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
        }
        .menu-icon { font-size: 24px; cursor: pointer; color: #333; }
        .title-group {
            text-align: center;
            flex-grow: 1;
        }
        .title-group h1 {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
        .title-group .subtitle {
            font-size: 14px;
            color: #3b82f6;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .add-icon { font-size: 24px; cursor: pointer; }

        /* Chat Area */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 20px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .message.user {
            align-self: flex-end;
            background-color: #3b82f6;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.ai {
            align-self: flex-start;
            background-color: #f1f5f9;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        /* Input Area */
        .input-area {
            padding: 0 15px 10px 15px;
            background: white;
            border-top: 1px solid #f0f0f0;
        }
        .input-wrapper {
            background: white;
            border: 1px solid #e4e4e7;
            border-radius: 20px;
            padding: 12px 16px;
            margin-bottom: 8px;
        }
        .input-wrapper textarea {
            width: 100%;
            border: none;
            outline: none;
            resize: none;
            font-size: 16px;
            min-height: 24px;
            max-height: 100px;
            background: transparent;
            color: #333;
            font-family: inherit;
        }
        .input-wrapper textarea::placeholder {
            color: #a1a1aa;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 8px 0 10px 0;
        }
        .button-group button {
            cursor: pointer;
            border: 1px solid #e4e4e7;
            background: white;
            transition: all 0.2s;
            color: #333;
        }
        .button-group button:active {
            transform: scale(0.96);
            background: #f9fafb;
        }
        .pill-btn {
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .pill-btn.search-btn {
            background: #f0f9ff;
            border-color: #bae6fd;
        }
        .icon-btn {
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .mic-btn {
            border: 1px solid #e4e4e7;
        }
        .mic-btn.listening {
            background: #fee2e2 !important;
            border-color: #fca5a5 !important;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        footer {
            text-align: center;
            color: #999;
            padding: 10px 15px 20px 15px;
            font-size: 12px;
            background: white;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="menu-icon">☰</div>
        <div class="title-group">
            <h1>Greeting</h1>
            <span class="subtitle">⚡ Instant</span>
        </div>
        <div class="add-icon">+</div>
    </header>

    <div class="chat-area" id="chatArea">
        <!-- Messages will appear here -->
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <textarea id="userInput" rows="1" placeholder="Type a message or hold to speak"></textarea>
        </div>

        <div class="button-group">
            <button class="pill-btn think-btn" id="thinkBtn">⚛️ Think</button>
            <button class="pill-btn search-btn">🌐 Search</button>
            <button class="icon-btn add-btn">+</button>
            <button class="icon-btn mic-btn" id="micBtn">🎤</button>
        </div>
    </div>

    <footer>
        <p>© 2026 Empire AI Studio</p>
    </footer>
</div>

<script>
    const chatArea = document.getElementById('chatArea');
    const userInput = document.getElementById('userInput');
    const thinkBtn = document.getElementById('thinkBtn');
    const micBtn = document.getElementById('micBtn');

    // --- 1. Message Send & UI Logic ---
    function addMessage(sender, text) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;
        msgDiv.textContent = text;
        chatArea.appendChild(msgDiv);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function handleSend() {
        const text = userInput.value.trim();
        if (!text) return;
        
        addMessage('user', text);
        userInput.value = '';
        userInput.style.height = 'auto'; // Reset height

        // Simulated AI Reply (since we don't have the backend)
        setTimeout(() => {
            if(text.toLowerCase().includes('hello')) {
                addMessage('ai', 'Hello! How can I assist you today?');
            } else {
                addMessage('ai', 'I received your message. I am still learning, but ask me anything!');
            }
        }, 800);
    }

    // Send on Enter key (Shift+Enter for new line)
    userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSend();
        }
    });

    thinkBtn.addEventListener('click', handleSend);

    // Auto-resize textarea
    userInput.addEventListener('input', () => {
        userInput.style.height = 'auto';
        userInput.style.height = userInput.scrollHeight + 'px';
    });

    // --- 2. Voice to Text (Replace purana speakScript) ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            userInput.value += (userInput.value.length > 0 ? ' ' : '') + transcript;
            // Auto resize textarea
            userInput.style.height = 'auto';
            userInput.style.height = userInput.scrollHeight + 'px';
        };

        recognition.onerror = (event) => {
            console.error('Speech recognition error', event.error);
            micBtn.classList.remove('listening');
            isListening = false;
        };

        recognition.onend = () => {
            micBtn.classList.remove('listening');
            isListening = false;
        };

        // Hold to speak (Mouse)
        micBtn.addEventListener('mousedown', () => {
            if(!isListening) {
                recognition.start();
                isListening = true;
                micBtn.classList.add('listening');
            }
        });
        micBtn.addEventListener('mouseup', () => {
            if(isListening) {
                recognition.stop();
            }
        });
        micBtn.addEventListener('mouseleave', () => {
            if(isListening) {
                recognition.stop();
            }
        });

        // Hold to speak (Touch - Mobile)
        micBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if(!isListening) {
                recognition.start();
                isListening = true;
                micBtn.classList.add('listening');
            }
        });
        micBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            if(isListening) {
                recognition.stop();
            }
        });
    } else {
        micBtn.style.opacity = '0.5';
        micBtn.title = "Voice not supported in this browser";
    }
</script>

</body>
</html>
