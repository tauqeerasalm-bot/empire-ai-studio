<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Empire AI Studio</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b0f;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 25px 15px;
      text-align: center;
      background: #15151d;
      border-bottom: 3px solid #d4af37;
    }

    header h1 {
      color: #d4af37;
      font-size: 32px;
    }

    header p {
      color: #d0d0d0;
      margin-top: 10px;
      font-size: 18px;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 30px 18px;
    }

    .hero {
      text-align: center;
      padding: 35px 10px;
    }

    .hero h2 {
      font-size: 42px;
      line-height: 1.2;
      margin-bottom: 20px;
    }

    .hero p {
      color: #cfcfd4;
      font-size: 20px;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-block;
      background: #d4af37;
      color: #111;
      padding: 18px 28px;
      border-radius: 14px;
      font-size: 20px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }

    .project-box {
      display: none;
      max-width: 650px;
      margin: 25px auto;
      padding: 25px;
      background: #171720;
      border: 1px solid #333340;
      border-radius: 20px;
    }

    .project-box h3 {
      font-size: 30px;
      margin-bottom: 20px;
    }

    input,
    select,
    textarea {
      width: 100%;
      margin-bottom: 18px;
      padding: 17px;
      border-radius: 12px;
      border: 1px solid #444452;
      background: #0e0e14;
      color: white;
      font-size: 17px;
    }

    textarea {
      min-height: 170px;
      resize: vertical;
    }

    .message {
      margin-top: 20px;
      color: #d4af37;
      font-size: 19px;
      line-height: 1.5;
    }

    footer {
      text-align: center;
      color: #999;
      padding: 25px 15px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 28px;
      }

      .hero h2 {
        font-size: 35px;
      }

      .hero p {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>👑 Empire AI Studio</h1>
    <p>Create • Edit • Sync • Publish</p>
  </header>

  <main>

    <section class="hero">
      <h2>Create Amazing AI Videos</h2>

      <p>
        Script, AI Voice, Media, Captions aur Auto Editing —
        sab aik hi studio mein.
      </p>

      <button class="btn" onclick="openProject()">
        + Create New Project
      </button>
    </section>

    <section class="project-box" id="projectBox">

      <h3>New Video Project</h3>

      <input
        type="text"
        id="projectName"
        placeholder="Project name"
      >

      <select id="videoType">
        <option>YouTube Short — 9:16</option>
        <option>YouTube Video — 16:9</option>
        <option>Instagram Reel — 9:16</option>
        <option>Facebook Video — 9:16</option>
      </select>

      <textarea
        id="script"
        placeholder="Apna topic ya script yahan likhein..."
      ></textarea>

      <button class="btn" onclick="startProject()">
        Start AI Project
      </button>

      <p class="message" id="message"></p>

    </section>

  </main>

  <footer>
    © 2026 Empire AI Studio
  </footer>

  <script>
    function openProject() {
      document.getElementById("projectBox").style.display = "block";
      document.getElementById("projectBox")
        .scrollIntoView({ behavior: "smooth" });
    }

    function startProject() {
      const name =
        document.getElementById("projectName").value.trim();

      const script =
        document.getElementById("script").value.trim();

      const message =
        document.getElementById("message");

      if (name === "" || script === "") {
        message.innerHTML =
          "Please project name aur script dono likhein.";
