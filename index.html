<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empire AI Studio</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b0f;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 25px 15px;
      text-align: center;
      background: #15151d;
      border-bottom: 3px solid #d4af37;
    }

    header h1 {
      color: #d4af37;
      font-size: 32px;
    }

    header p {
      color: #d0d0d0;
      margin-top: 10px;
      font-size: 18px;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 30px 18px;
    }

    .hero {
      text-align: center;
      padding: 35px 10px;
    }

    .hero h2 {
      font-size: 42px;
      line-height: 1.2;
      margin-bottom: 20px;
    }

    .hero p {
      color: #cfcfd4;
      font-size: 20px;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-block;
      background: #d4af37;
      color: #111;
      padding: 18px 28px;
      border-radius: 14px;
      font-size: 20px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      border: none;
      margin: 5px;
    }

    .btn-secondary {
      background: #444;
      color: white;
    }

    .btn-danger {
      background: #8b0000;
      color: white;
    }

    .project-box {
      display: none;
      max-width: 650px;
      margin: 25px auto;
      padding: 25px;
      background: #171720;
      border: 1px solid #333340;
      border-radius: 20px;
    }

    .project-box h3 {
      font-size: 30px;
      margin-bottom: 20px;
    }

    input,
    select,
    textarea {
      width: 100%;
      margin-bottom: 18px;
      padding: 17px;
      border-radius: 12px;
      border: 1px solid #444452;
      background: #0e0e14;
      color: white;
      font-size: 17px;
    }

    textarea {
      min-height: 170px;
      resize: vertical;
    }

    .message {
      margin-top: 20px;
      color: #d4af37;
      font-size: 19px;
      line-height: 1.5;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 15px 0;
    }

    footer {
      text-align: center;
      color: #999;
      padding: 25px 15px;
    }

    #captionsOverlay {
      background: rgba(0,0,0,0.8);
      color: #d4af37;
      padding: 15px;
      border-radius: 10px;
      margin-top: 10px;
      border-left: 4px solid #d4af37;
      display: none;
    }

    /* Voice Controls Styling */
    .voice-controls {
      background: #1a1a25;
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
      margin-bottom: 15px;
    }
    .voice-controls h4 {
      color: #d4af37;
      margin-bottom: 10px;
    }
    .voice-controls label {
      color: #ccc;
    }
    .voice-controls select,
    .voice-controls input[type="range"] {
      width: 100%;
      margin-bottom: 10px;
      padding: 12px;
      border-radius: 8px;
      background: #0e0e14;
      color: white;
      border: 1px solid #444;
    }
    .voice-controls input[type="range"] {
      padding: 0;
      margin-bottom: 10px;
    }
    .voice-controls .slider-value {
      color: #d4af37;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 28px;
      }
      .hero h2 {
        font-size: 35px;
      }
      .hero p {
        font-size: 18px;
      }
      .button-group .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>👑 Empire AI Studio</h1>
    <p>Create • Edit • Sync • Publish</p>
  </header>

  <main>
    <section class="hero">
      <h2>Create Amazing AI Videos</h2>
      <p>Script, AI Voice, Media, Captions aur Auto Editing — sab aik hi studio mein.</p>
      <button class="btn" onclick="openProject()">+ Create New Project</button>
    </section>

    <section class="project-box" id="projectBox">
      <h3>New Video Project</h3>

      <input type="text" id="projectName" placeholder="Project name">
      
      <select id="videoType">
        <option>YouTube Short — 9:16</option>
        <option>YouTube Video — 16:9</option>
        <option>Instagram Reel — 9:16</option>
        <option>Facebook Video — 9:16</option>
      </select>

      <textarea id="script" placeholder="Apna topic ya script yahan likhein... (Example: A robot walking on Mars)"></textarea>

      <!-- ===== AI VOICE CONTROLS ===== -->
      <div class="voice-controls">
        <h4>🎤 AI Voice Settings</h4>

        <!-- Language -->
        <label>🌍 Language:</label>
        <select id="langSelect">
          <option value="en-GB">English (UK) 🇬🇧</option>
          <option value="en-US">English (US) 🇺🇸</option>
          <option value="ur-PK">Urdu (اردو) 🇵🇰</option>
          <option value="hi-IN">Hindi (हिन्दी) 🇮🇳</option>
          <option value="ar-SA">Arabic (العربية) 🇸🇦</option>
          <option value="es-ES">Spanish (Español) 🇪🇸</option>
          <option value="fr-FR">French (Français) 🇫🇷</option>
          <option value="de-DE">German (Deutsch) 🇩🇪</option>
          <option value="ja-JP">Japanese (日本語) 🇯🇵</option>
          <option value="zh-CN">Chinese (中文) 🇨🇳</option>
        </select>

        <!-- Voice (Gender + Age) -->
        <label>🗣️ Voice (Gender/Age):</label>
        <select id="voiceSelect">
          <option value="">Default (Browser)</option>
        </select>

        <!-- Style (Mood) -->
        <label>🎭 Style (Mood):</label>
        <select id="styleSelect">
          <option value="normal">Normal</option>
          <option value="poetry">Poetry (Slow & Soft)</option>
          <option value="sad">Sad (Slow & Low)</option>
          <option value="casual">Casual (Fast & Natural)</option>
          <option value="excited">Excited (Fast & High)</option>
          <option value="robot">Robot (Modulated)</option>
          <option value="whisper">Whisper (Very Slow & Low)</option>
        </select>

        <!-- Speed Slider -->
        <label>⏩ Speed: <span class="slider-value" id="rateValue">0.9</span></label>
        <input type="range" id="rateSlider" min="0.1" max="3" step="0.1" value="0.9">

        <!-- Pitch Slider -->
        <label>🎵 Pitch: <span class="slider-value" id="pitchValue">1.0</span></label>
        <input type="range" id="pitchSlider" min="0.5" max="2" step="0.1" value="1.0">

        <!-- Volume Slider -->
        <label>🔊 Volume: <span class="slider-value" id="volumeValue">1.0</span></label>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1.0">
      </div>

      <!-- Buttons -->
      <div class="button-group">
        <button class="btn btn-secondary" onclick="speakScript()">🔊 Listen with AI Voice</button>
        <button class="btn btn-secondary" onclick="downloadVoice()">💾 Download MP3</button>
        <button class="btn btn-secondary" onclick="showCaptions()">📝 Generate Captions</button>
      </div>

      <button class="btn" onclick="startProject()">✅ Start AI Project</button>
      <p class="message" id="message"></p>

      <div id="resultCard" style="display:none; margin-top:25px; padding:20px; border:1px solid #d4af37; border-radius:15px;">
        <h3>🎬 AI Video Project Ready</h3>
        <p id="resultName"></p>
        <p id="resultType"></p>
        <div id="resultScript"></div>
        
        <!-- Captions yahan show hongay -->
        <div id="captionsOverlay"></div>
        
        <button class="btn" onclick="generateVideo()" style="margin-top:15px;">🚀 Generate AI Video (Real)</button>
        <button class="btn btn-secondary" onclick="clearAll()" style="margin-top:15px;">🗑️ Clear All</button>
      </div>
    </section>
  </main>

  <footer>© 2026 Empire AI Studio</footer>

  <script>
    // ==========================================
    // UI CONTROL FUNCTIONS
    // ==========================================
    function openProject() {
      const projectBox = document.getElementById("projectBox");
      projectBox.style.display = "block";
      projectBox.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function startProject() {
      const name = document.getElementById("projectName").value.trim();
      const script = document.getElementById("script").value.trim();
      const message = document.getElementById("message");

      if (name === "" || script === "") {
        message.innerHTML = "⚠️ Please project name aur script dono likhein.";
        return;
      }

      message.innerHTML = "✅ Project <b>" + name + "</b> successfully create ho gaya!";
      document.getElementById("resultCard").style.display = "block";
      document.getElementById("resultName").innerHTML = "<b>📁 Project:</b> " + name;
      document.getElementById("resultType").innerHTML = "<b>📐 Video Type:</b> " + document.getElementById("videoType").value;
      document.getElementById("resultScript").innerHTML = "<b>📜 Script:</b> " + script;
      
      document.getElementById("captionsOverlay").style.display = "none";
    }

    function clearAll() {
      document.getElementById("projectName").value = "";
      document.getElementById("script").value = "";
      document.getElementById("resultCard").style.display = "none";
      document.getElementById("message").innerHTML = "";
      window.speechSynthesis.cancel();
    }

    // ==========================================
    // LOAD VOICES (Gender & Age)
    // ==========================================
    function loadVoices() {
      const voices = window.speechSynthesis.getVoices();
      const select = document.getElementById('voiceSelect');
      if (!select) return;
      
      select.innerHTML = '<option value="">Default (Browser)</option>';
      
      voices.forEach(voice => {
        const option = document.createElement('option');
        option.value = voice.name;
        option.textContent = `${voice.name} (${voice.lang})`;
        select.appendChild(option);
      });
    }

    window.speechSynthesis.onvoiceschanged = loadVoices;

    // ==========================================
    // SPEAK FUNCTION (Language, Style, Gender, Age)
    // ==========================================
    function speakScript() {
      const scriptText = document.getElementById("script").value.trim();
      const message = document.getElementById("message");
      
      if (!scriptText) {
        message.innerHTML = "⚠️ Pehle script likho!";
        return;
      }

      window.speechSynthesis.cancel();

      const lang = document.getElementById('langSelect').value;
      const style = document.getElementById('styleSelect').value;
      const rate = parseFloat(document.getElementById('rateSlider').value);
      const pitch = parseFloat(document.getElementById('pitchSlider').value);
      const volume = parseFloat(document.getElementById('volumeSlider').value);

      const utterance = new SpeechSynthesisUtterance(scriptText);
      
      utterance.lang = lang;

      const selectedVoice = document.getElementById('voiceSelect').value;
      if (selectedVoice) {
        const voice = window.speechSynthesis.getVoices().find(v => v.name === selectedVoice);
        if (voice) utterance.voice = voice;
      }

      switch(style) {
        case 'poetry':
          utterance.rate = 0.6; utterance.pitch = 1.1; break;
        case 'sad':
          utterance.rate = 0.5; utterance.pitch = 0.8; break;
        case 'casual':
          utterance.rate = 1.2; utterance.pitch = 1.0; break;
        case 'excited':
          utterance.rate = 1.4; utterance.pitch = 1.3; break;
        case 'robot':
          utterance.rate = 1.0; utterance.pitch = 0.5; break;
        case 'whisper':
          utterance.rate = 0.3; utterance.pitch = 0.5; break;
        default:
          utterance.rate = rate;
          utterance.pitch = pitch;
      }

      utterance.rate = parseFloat(document.getElementById('rateSlider').value);
      utterance.pitch = parseFloat(document.getElementById('pitchSlider').value);
      utterance.volume = parseFloat(document.getElementById('volumeSlider').value);

      utterance.onstart = function() {
        message.innerHTML = `🎙️ AI Voice play ho rahi hai... (${style} style)`;
      };
      utterance.onend = function() {
        message.innerHTML = "✅ Voice complete!";
      };
      utterance.onerror = function() {
        message.innerHTML = "❌ Awaz nahi aa rahi. Browser speech supported nahi hai.";
      };

      window.speechSynthesis.speak(utterance);
    }

    // ==========================================
    // AUTO CAPTIONS (SUBTITLES)
    // ==========================================
    function showCaptions() {
      const script = document.getElementById("script").value.trim();
      const message = document.getElementById("message");
      const captionsDiv = document.getElementById("captionsOverlay");

      if (!script) {
        message.innerHTML = "⚠️ Pehle script likho!";
        return;
      }

      captionsDiv.style.display = "block";
      captionsDiv.innerText = "📝 " + script;
      document.getElementById("resultCard").style.display = "block";
      
      message.innerHTML = "✅ Captions generate ho gaye!";
    }

    // ==========================================
    // VOICE DOWNLOAD FUNCTION (MP3)
    // ==========================================
    let mediaRecorder;
    let audioChunks = [];

    function downloadVoice() {
      const scriptText = document.getElementById("script").value.trim();
      const message = document.getElementById("message");
      
      if (!scriptText) {
        message.innerHTML = "⚠️ Pehle script likho!";
        return;
      }

      message.innerHTML = "⏳ Voice record ho rahi hai...";

      const utterance = new SpeechSynthesisUtterance(scriptText);
      
      const lang = document.getElementById('langSelect').value;
      utterance.lang = lang;
      
      const selectedVoice = document.getElementById('voiceSelect').value;
      if (selectedVoice) {
        const voice = window.speechSynthesis.getVoices().find(v => v.name === selectedVoice);
        if (voice) utterance.voice = voice;
      }

      utterance.rate = parseFloat(document.getElementById('rateSlider').value);
      utterance.pitch = parseFloat(document.getElementById('pitchSlider').value);
      utterance.volume = parseFloat(document.getElementById('volumeSlider').value);

      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const destination = audioContext.createMediaStreamDestination();
      
      mediaRecorder = new MediaRecorder(destination.stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = event => {
        if (event.data.size > 0) audioChunks.push(event.data);
      };

      mediaRecorder.onstop = function() {
        const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
        const audioUrl = URL.createObjectURL(audioBlob);
        
        const a = document.createElement('a');
        a.href = audioUrl;
        a.download = `ai_voice_${Date.now()}.mp3`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(audioUrl);
        
        message.innerHTML = "✅ Voice download ho gayi! 🎉";
        audioContext.close();
      };

      mediaRecorder.start();

      utterance.onend = function() {
        mediaRecorder.stop();
      };

      utterance.onerror = function() {
        message.innerHTML = "❌ Voice generate nahi ho pai.";
        mediaRecorder.stop();
      };

      window.speechSynthesis.speak(utterance);
    }

    // ==========================================
    // SLIDER UI UPDATE
    // ==========================================
    document.addEventListener('DOMContentLoaded', function() {
      const rateSlider = document.getElementById('rateSlider');
      const rateValue = document.getElementById('rateValue');
      if (rateSlider && rateValue) {
        rateSlider.addEventListener('input', function() {
          rateValue.textContent = this.value;
        });
      }

      const pitchSlider = document.getElementById('pitchSlider');
      const pitchValue = document.getElementById('pitchValue');
      if (pitchSlider && pitchValue) {
        pitchSlider.addEventListener('input', function() {
          pitchValue.textContent = this.value;
        });
      }

      const volumeSlider = document.getElementById('volumeSlider');
      const volumeValue = document.getElementById('volumeValue');
      if (volumeSlider && volumeValue) {
        volumeSlider.addEventListener('input', function() {
          volumeValue.textContent = this.value;
        });
      }
    });

    setTimeout(loadVoices, 1000);

    // ==========================================
    // REAL AI VIDEO GENERATOR
    // ==========================================
    async function generateVideo() {
      const script = document.getElementById("script").value.trim();
      const message = document.getElementById("message");
      const resultScript = document.getElementById("resultScript");

      if (!script) {
        message.innerHTML = "⚠️ Pehle script likho!";
        return;
      }

      message.innerHTML = "⏳ AI video generate ho rahi hai (1-2 min)...";
      resultScript.innerHTML = "<i>🔄 Please wait... Backend server se response aa raha hai. Ensure server is running.</i>";
      document.getElementById("resultCard").style.display = "block";

      try {
        const response = await fetch("https://empire-ai-studio.vercel.app/api/generate-video", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ script: script })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Server error");
        }

        resultScript.innerHTML = `
          <video controls style="width:100%; max-height:400px; border-radius:12px; margin-top:10px;">
            <source src="${data.videoUrl}" type="video/mp4">
            Aapka browser video support nahi karta.
          </video>
        `;
        message.innerHTML = "🎬 AI Video ready! (Generated by FAL.ai)";

      } catch (error) {
        console.error("Error:", error);
        message.innerHTML = "❌ Error: " + error.message;
        resultScript.innerHTML = "<span style='color:red;'>❌ Server connection failed.</span>";
      }
    }
  </script>
</body>
            </html>
