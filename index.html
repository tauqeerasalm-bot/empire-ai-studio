<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empire AI Studio</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b0f;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 25px 15px;
      text-align: center;
      background: #15151d;
      border-bottom: 3px solid #d4af37;
    }

    header h1 {
      color: #d4af37;
      font-size: 32px;
    }

    header p {
      color: #d0d0d0;
      margin-top: 10px;
      font-size: 18px;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 30px 18px;
    }

    .hero {
      text-align: center;
      padding: 35px 10px;
    }

    .hero h2 {
      font-size: 42px;
      line-height: 1.2;
      margin-bottom: 20px;
    }

    .hero p {
      color: #cfcfd4;
      font-size: 20px;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-block;
      background: #d4af37;
      color: #111;
      padding: 18px 28px;
      border-radius: 14px;
      font-size: 20px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      border: none;
      margin: 5px;
    }

    .btn-secondary {
      background: #444;
      color: white;
    }

    .btn-danger {
      background: #8b0000;
      color: white;
    }

    .project-box {
      display: none;
      max-width: 650px;
      margin: 25px auto;
      padding: 25px;
      background: #171720;
      border: 1px solid #333340;
      border-radius: 20px;
    }

    .project-box h3 {
      font-size: 30px;
      margin-bottom: 20px;
    }

    input,
    select,
    textarea {
      width: 100%;
      margin-bottom: 18px;
      padding: 17px;
      border-radius: 12px;
      border: 1px solid #444452;
      background: #0e0e14;
      color: white;
      font-size: 17px;
    }

    textarea {
      min-height: 170px;
      resize: vertical;
    }

    .message {
      margin-top: 20px;
      color: #d4af37;
      font-size: 19px;
      line-height: 1.5;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 15px 0;
    }

    footer {
      text-align: center;
      color: #999;
      padding: 25px 15px;
    }

    #captionsOverlay {
      background: rgba(0,0,0,0.8);
      color: #d4af37;
      padding: 15px;
      border-radius: 10px;
      margin-top: 10px;
      border-left: 4px solid #d4af37;
      display: none;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 28px;
      }
      .hero h2 {
        font-size: 35px;
      }
      .hero p {
        font-size: 18px;
      }
      .button-group .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>👑 Empire AI Studio</h1>
    <p>Create • Edit • Sync • Publish</p>
  </header>

  <main>
    <section class="hero">
      <h2>Create Amazing AI Videos</h2>
      <p>Script, AI Voice, Media, Captions aur Auto Editing — sab aik hi studio mein.</p>
      <button class="btn" onclick="openProject()">+ Create New Project</button>
    </section>

    <section class="project-box" id="projectBox">
      <h3>New Video Project</h3>

      <input type="text" id="projectName" placeholder="Project name">
      
      <select id="videoType">
        <option>YouTube Short — 9:16</option>
        <option>YouTube Video — 16:9</option>
        <option>Instagram Reel — 9:16</option>
        <option>Facebook Video — 9:16</option>
      </select>

      <textarea id="script" placeholder="Apna topic ya script yahan likhein... (Example: A robot walking on Mars)"></textarea>

      <!-- 🔥 NAYE BUTTONS: Voice aur Captions -->
      <div class="button-group">
        <button class="btn btn-secondary" onclick="speakScript()">🔊 Listen with AI Voice (UK)</button>
        <button class="btn btn-secondary" onclick="showCaptions()">📝 Generate Captions</button>
      </div>

      <button class="btn" onclick="startProject()">✅ Start AI Project</button>
      <p class="message" id="message"></p>

      <div id="resultCard" style="display:none; margin-top:25px; padding:20px; border:1px solid #d4af37; border-radius:15px;">
        <h3>🎬 AI Video Project Ready</h3>
        <p id="resultName"></p>
        <p id="resultType"></p>
        <div id="resultScript"></div>
        
        <!-- Captions yahan show hongay -->
        <div id="captionsOverlay"></div>
        
        <button class="btn" onclick="generateVideo()" style="margin-top:15px;">🚀 Generate AI Video (Real)</button>
        <button class="btn btn-secondary" onclick="clearAll()" style="margin-top:15px;">🗑️ Clear All</button>
      </div>
    </section>
  </main>

  <footer>© 2026 Empire AI Studio</footer>

  <script>
    // ==========================================
    // STEP 1: UI CONTROL FUNCTIONS
    // ==========================================
    function openProject() {
      const projectBox = document.getElementById("projectBox");
      projectBox.style.display = "block";
      projectBox.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function startProject() {
      const name = document.getElementById("projectName").value.trim();
      const script = document.getElementById("script").value.trim();
      const message = document.getElementById("message");

      if (name === "" || script === "") {
        message.innerHTML = "⚠️ Please project name aur script dono likhein.";
        return;
      }

      message.innerHTML = "✅ Project <b>" + name + "</b> successfully create ho gaya!";
      document.getElementById("resultCard").style.display = "block";
      document.getElementById("resultName").innerHTML = "<b>📁 Project:</b> " + name;
      document.getElementById("resultType").innerHTML = "<b>📐 Video Type:</b> " + document.getElementById("videoType").value;
      document.getElementById("resultScript").innerHTML = "<b>📜 Script:</b> " + script;
      
      // Captions aur video area reset karein
      document.getElementById("captionsOverlay").style.display = "none";
    }

    function clearAll() {
      document.getElementById("projectName").value = "";
      document.getElementById("script").value = "";
      document.getElementById("resultCard").style.display = "none";
      document.getElementById("message").innerHTML = "";
      window.speechSynthesis.cancel(); // Voice band karein
    }

    // ==========================================
    // STEP 2: 🔥 AI VOICE (UK ACCENT - FREE)
    // ==========================================
    function speakScript() {
      const scriptText = document.getElementById("script").value.trim();
      const message = document.getElementById("message");
      
      if (!scriptText) {
        message.innerHTML = "⚠️ Pehle script likho!";
        return;
      }

      // Agar awaz chal rahi hai toh rok dein
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(scriptText);
      utterance.lang = 'en-GB'; // UK accent
      utterance.rate = 0.9;
      utterance.pitch = 1;
      window.speechSynthesis.speak(utterance);
      
      message.innerHTML = "🎙️ UK AI Voice play ho rahi hai... (Browser ki built-in speech)";
    }

    // ==========================================
    // STEP 3: 🔥 AUTO CAPTIONS (SUBTITLES)
    // ==========================================
    function showCaptions() {
      const script = document.getElementById("script").value.trim();
      const message = document.getElementById("message");
      const captionsDiv = document.getElementById("captionsOverlay");

      if (!script) {
        message.innerHTML = "⚠️ Pehle script likho!";
        return;
      }

      // Captions div ko show karein aur text daalein
      captionsDiv.style.display = "block";
      captionsDiv.innerText = "📝 " + script;
      document.getElementById("resultCard").style.display = "block";
      
      message.innerHTML = "✅ Captions generate ho gaye!";
    }

    // ==========================================
    // STEP 4: 🔥 REAL AI VIDEO GENERATOR
    // ==========================================
    async function generateVideo() {
      const script = document.getElementById("script").value.trim();
      const message = document.getElementById("message");
      const resultScript = document.getElementById("resultScript");

      if (!script) {
        message.innerHTML = "⚠️ Pehle script likho!";
        return;
      }

      // Loading state
      message.innerHTML = "⏳ AI video generate ho rahi hai (1-2 min)...";
      resultScript.innerHTML = "<i>🔄 Please wait... Backend server se response aa raha hai. Ensure server is running.</i>";
      document.getElementById("resultCard").style.display = "block";

      try {
        // 👇 Apne local backend server ko call karein
        const response = await fetch("http://localhost:5000/generate-video", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ script: script })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Server error");
        }

        // Video player mein dikhayein
        resultScript.innerHTML = `
          <video controls style="width:100%; max-height:400px; border-radius:12px; margin-top:10px;">
            <source src="${data.videoUrl}" type="video/mp4">
            Aapka browser video support nahi karta.
          </video>
        `;
        message.innerHTML = "🎬 AI Video ready! (Generated by FAL.ai)";

      } catch (error) {
        console.error("Error:", error);
        message.innerHTML = "❌ Error: " + error.message + ". Ensure server.js is running on port 5000.";
        resultScript.innerHTML = "<span style='color:red;'>❌ Server connection failed. Backend start karein (node server.js).</span>";
      }
    }
  </script>
</body>
</html>
